    <script>
      // Legacy Chrome 69 inline polyfills
      if (typeof AbortSignal !== "undefined" && !AbortSignal.timeout) {
        AbortSignal.timeout = function (ms) {
          var c = new AbortController();
          setTimeout(function () {
            try { c.abort(); } catch (e) {}
          }, ms);
          return c.signal;
        };
      }
    </script>
