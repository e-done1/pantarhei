name: Build and Package Decaid Skin

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Skin ZIP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Run Test Suite
        run: npm test

      - name: Build Skin (Production Vite)
        run: npm run build

      - name: Package Skin ZIP for Decaid
        # Decaid expects index.html directly at the root of the zip archive
        run: |
          cd dist
          zip -r ../pantarhei.zip .
          cd ..

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pantarhei-skin
          path: pantarhei.zip
          retention-days: 30

      - name: Publish Release Asset (on Tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: pantarhei.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
